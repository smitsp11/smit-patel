<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="table" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#5c4033;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3d2914;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="coffee" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1810;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f0a;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Wooden table background -->
  <rect width="400" height="400" fill="url(#table)"/>
  <!-- Wood grain lines -->
  <line x1="0" y1="50" x2="400" y2="60" stroke="#4a3525" stroke-width="2"/>
  <line x1="0" y1="150" x2="400" y2="145" stroke="#4a3525" stroke-width="2"/>
  <line x1="0" y1="250" x2="400" y2="260" stroke="#4a3525" stroke-width="2"/>
  <line x1="0" y1="350" x2="400" y2="345" stroke="#4a3525" stroke-width="2"/>
  
  <!-- Coffee cup -->
  <ellipse cx="280" cy="200" rx="60" ry="20" fill="#fdfbf7"/>
  <path d="M220,200 L230,280 Q280,300 330,280 L340,200" fill="#fdfbf7"/>
  <ellipse cx="280" cy="200" rx="50" ry="15" fill="url(#coffee)"/>
  <!-- Handle -->
  <path d="M340,220 Q380,220 380,250 Q380,280 340,280" stroke="#fdfbf7" stroke-width="8" fill="none"/>
  <!-- Steam -->
  <path d="M260,170 Q250,150 260,130" stroke="#e8d5a3" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M280,165 Q290,140 280,120" stroke="#e8d5a3" stroke-width="3" fill="none" opacity="0.6"/>
  <path d="M300,170 Q310,150 300,130" stroke="#e8d5a3" stroke-width="3" fill="none" opacity="0.6"/>
  
  <!-- Notebook/paper -->
  <rect x="80" y="140" width="100" height="140" fill="#fdfbf7" transform="rotate(-5 130 210)"/>
  <line x1="95" y1="165" x2="165" y2="160" stroke="#d4a574" stroke-width="1"/>
  <line x1="95" y1="185" x2="165" y2="180" stroke="#d4a574" stroke-width="1"/>
  <line x1="95" y1="205" x2="165" y2="200" stroke="#d4a574" stroke-width="1"/>
  <line x1="95" y1="225" x2="145" y2="222" stroke="#d4a574" stroke-width="1"/>
  
  <!-- Pen -->
  <rect x="190" y="300" width="80" height="8" rx="2" fill="#c9a55c" transform="rotate(-20 230 304)"/>
  <polygon points="270,290 280,294 270,298" fill="#3d2914" transform="rotate(-20 275 294)"/>
</svg>