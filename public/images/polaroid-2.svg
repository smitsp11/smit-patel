<svg xmlns="http://www.w3.org/2000/svg" width="400" height="400" viewBox="0 0 400 400">
  <defs>
    <linearGradient id="sky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#e8d5a3;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fdfbf7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountain1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3d2914;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#5c4033;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="mountain2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#a08060;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="400" height="400" fill="url(#sky)"/>
  <!-- Sun -->
  <circle cx="300" cy="100" r="40" fill="#c9a55c" opacity="0.8"/>
  <!-- Mountains back -->
  <polygon points="0,280 80,180 160,240 200,160 280,220 360,140 400,200 400,400 0,400" fill="url(#mountain1)"/>
  <!-- Mountains front -->
  <polygon points="0,320 60,260 120,300 180,240 260,290 320,220 400,280 400,400 0,400" fill="url(#mountain2)"/>
  <!-- Trees -->
  <polygon points="50,320 60,280 70,320" fill="#3d2914"/>
  <polygon points="340,290 355,240 370,290" fill="#3d2914"/>
  <polygon points="100,340 115,290 130,340" fill="#3d2914"/>
</svg>